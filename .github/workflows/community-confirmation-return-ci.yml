name: Validate WhatsApp community invitation onboarding
# Manual diagnostic job; pull requests use the consolidated pr-validation.yml.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Invitation, login, registration and auth tests
        run: npm test -- --watch=false --browsers=ChromeHeadless --include=src/app/shared/registration-return-url.spec.ts --include=src/app/shared/safe-login-return-url.spec.ts --include=src/app/app.component.spec.ts --include=src/app/pages/createaccount/createaccount.component.spec.ts --include=src/app/pages/login/login.component.spec.ts --include=src/app/services/authethication.service.spec.ts
      - run: npm run build
