name: Jynlo QA - provision private weekly test session

# One-time protected QA fixture. Avoid accidental writes from ordinary pushes.
on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/qa-provision-weekly-session.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jynlo-qa-weekly-session-provision-once
  cancel-in-progress: false

jobs:
  provision:
    if: >-
      github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'qa(sessions): provision private weekly QA fixture once'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      JYNLO_QA_PASSWORD_1: ${{ secrets.JYNLO_QA1_PASSWORD }}
      JYNLO_QA_PASSWORD_2: ${{ secrets.JYNLO_QA2_PASSWORD }}
      JYNLO_QA_USERNAME_1: ${{ secrets.JYNLO_QA1_USERNAME }}
      JYNLO_QA_USERNAME_2: ${{ secrets.JYNLO_QA2_USERNAME }}
      JYNLO_QA_WEEKLY_SESSION_CONSENT: QA_CREATE_PRIVATE_WEEKLY_SERIES_ONCE
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate guarded QA script syntax
        run: node --check scripts/qa/jynlo-provision-weekly-session.cjs
      - name: Create or reuse private weekly QA fixture and join second account
        run: node scripts/qa/jynlo-provision-weekly-session.cjs
