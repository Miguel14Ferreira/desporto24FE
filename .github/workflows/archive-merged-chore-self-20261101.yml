name: Archive merged cleanup PR branch
on:
  push:
    branches: [develop]
    paths: [.github/workflows/archive-merged-chore-self-20261101.yml]
permissions:
  contents: write
  pull-requests: read
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Verify ancestry, tag and delete
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error
          repo=os.environ['REPO']
          name='chore/archive-merged-chore-branches-20261101'
          expected='73dc51b98ae3b75bd0871f5246974a56ea740cc6'
          def api(method,path,data=None):
              req=urllib.request.Request('https://api.github.com/repos/'+repo+path,method=method,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'},data=None if data is None else json.dumps(data).encode())
              with urllib.request.urlopen(req,timeout=30) as r: return json.loads(r.read() or b'{}')
          ref=api('GET','/git/ref/heads/'+name)
          assert ref['object']['sha']==expected
          comparison=api('GET','/compare/'+expected+'...develop')
          assert comparison['behind_by']==0 and comparison['status'] in ('ahead','identical')
          assert not api('GET','/pulls?state=open&head='+repo.split('/')[0]+':'+name)
          tag='archive/merged-chore-20261101/'+name
          try:
              existing=api('GET','/git/ref/tags/'+tag)
              assert existing['object']['sha']==expected
          except urllib.error.HTTPError as e:
              if e.code!=404: raise
              api('POST','/git/refs',{'ref':'refs/tags/'+tag,'sha':expected})
          assert api('GET','/git/ref/tags/'+tag)['object']['sha']==expected
          assert api('GET','/git/ref/heads/'+name)['object']['sha']==expected
          assert not api('GET','/pulls?state=open&head='+repo.split('/')[0]+':'+name)
          api('DELETE','/git/refs/heads/'+name)
          print('ARCHIVED_AND_DELETED',name,expected)
          PY
