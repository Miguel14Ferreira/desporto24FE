name: Validate venue Maps coordinate consistency
# Manual diagnostic job; pull requests use the consolidated pr-validation.yml.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Run all venue create and details tests
        run: npm test -- --watch=false --browsers=ChromeHeadless --include=src/app/pages/venue-create/venue-create.component.spec.ts --include=src/app/pages/venue-create/venue-map-link-consistency.spec.ts --include=src/app/pages/venue-details/venue-details.component.spec.ts --include=src/app/services/venue.service.spec.ts
      - run: npm run build
