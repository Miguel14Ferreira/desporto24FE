# Task 9 verification round 2: HttpClient test setup
name: Angular 22 One-Time Upgrade

on:
  push:
    branches:
      - feature/desporto24-relaunch-develop
    paths:
      - .github/workflows/angular-upgrade.yml

permissions:
  contents: write

jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/desporto24-relaunch-develop
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Node 18 for Angular 16-18
        uses: actions/setup-node@v4
        with:
          node-version: '18.20.8'
          cache: npm

      - name: Remove unused incompatible dependencies and refresh Angular 15 lock
        run: |
          npm pkg delete 'dependencies.@ngneat/query'
          npm pkg delete 'dependencies.@nestjs/ng-universal'
          npm pkg delete 'dependencies.angular-notifier'
          rm -rf node_modules
          npm install
          npm run build

      - name: Upgrade Angular 16
        run: |
          npx ng update @angular/core@16 @angular/cli@16 --allow-dirty
          npm run build

      - name: Upgrade Angular 17
        run: |
          npx ng update @angular/core@17 @angular/cli@17 --allow-dirty
          npm run build

      - name: Upgrade Angular 18
        run: |
          npx ng update @angular/core@18 @angular/cli@18 --allow-dirty
          npm run build

      - name: Node 20 for Angular 19-21
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.5'
          cache: npm

      - name: Upgrade Angular 19
        run: |
          npx ng update @angular/core@19 @angular/cli@19 --allow-dirty
          npm run build

      - name: Upgrade Angular 20
        run: |
          npx ng update @angular/core@20 @angular/cli@20 --allow-dirty
          npm run build

      - name: Upgrade Angular 21
        run: |
          npx ng update @angular/core@21 @angular/cli@21 --allow-dirty
          npm run build

      - name: Node 22 for Angular 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm

      - name: Upgrade Angular 22
        run: |
          node --version
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("tsconfig.json")
          raw = p.read_text()
          lines = [line for line in raw.splitlines() if not line.lstrip().startswith("/*")]
          data = json.loads("\n".join(lines))
          data.setdefault("compilerOptions", {})["ignoreDeprecations"] = "6.0"
          p.write_text(json.dumps(data, indent=2) + "\n")
          PY
          npx ng update @angular/core@22 @angular/cli@22 --allow-dirty
          npm run build

      - name: Run frontend tests
        run: npm test -- --watch=false --browsers=ChromeHeadless

      - name: Install final feature CI and remove one-time workflow
        run: |
          cat > .github/workflows/feature-ci.yml <<'YAML'
          name: Desporto24 FE Feature CI

          on:
            push:
              branches:
                - feature/desporto24-relaunch-develop
            pull_request:
              branches:
                - develop

          jobs:
            test-and-build:
              runs-on: ubuntu-latest
              timeout-minutes: 20
              steps:
                - name: Checkout
                  uses: actions/checkout@v4

                - name: Set up Node 22
                  uses: actions/setup-node@v4
                  with:
                    node-version: '22.23.3'
                    cache: npm

                - name: Install dependencies
                  run: npm ci

                - name: Run tests
                  run: npm test -- --watch=false --browsers=ChromeHeadless

                - name: Build
                  run: npm run build
          YAML
          rm .github/workflows/angular-upgrade.yml

      - name: Commit upgraded frontend
        run: |
          git add -A
          git commit -m "build: upgrade frontend to angular 22"
          git push origin HEAD:feature/desporto24-relaunch-develop
