name: Validate community public session action
on:
  pull_request:
    branches: [preview/render-fullstack]
    paths:
      - 'src/app/pages/communities/**'
      - '.github/workflows/community-public-session-action-ci.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test -- --watch=false --browsers=ChromeHeadless --include=src/app/pages/communities/communities.component.spec.ts
      - run: npm run build
