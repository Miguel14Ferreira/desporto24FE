name: Validate community WhatsApp group sharing
on:
  pull_request:
    branches: [preview/render-fullstack]
    paths:
      - 'src/app/pages/communities/communities.component.ts'
      - 'src/app/pages/communities/communities.component.html'
      - 'src/app/pages/communities/communities.component.css'
      - 'src/app/pages/communities/community-group-invite.ts'
      - 'src/app/pages/communities/community-group-invite.spec.ts'
      - 'src/app/pages/community-create/community-create.component.html'
      - 'src/app/i18n/i18n.service.ts'
      - '.github/workflows/community-whatsapp-group-invite-ci.yml'
permissions:
  contents: read
jobs:
  frontend-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test -- --watch=false --browsers=ChromeHeadless --include=src/app/pages/communities/community-group-invite.spec.ts
      - run: npm run build
