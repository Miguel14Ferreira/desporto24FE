name: Validate community discovery and onboarding
on:
  pull_request:
    branches: [preview/render-fullstack]
    paths:
      - 'src/app/pages/communities/communities.component.ts'
      - 'src/app/pages/communities/communities.component.html'
      - 'src/app/pages/communities/community-discovery-action.spec.ts'
      - 'src/app/pages/community-create/community-invite-step.component.ts'
      - 'src/app/pages/community-create/community-invite-step.component.html'
      - 'src/app/pages/community-create/community-invite-step.component.css'
      - 'src/app/pages/community-create/community-invite-step.component.spec.ts'
      - 'src/app/i18n/i18n.service.ts'
      - 'src/app/services/community-groups.service.ts'
      - '.github/workflows/community-onboarding-audit-ci.yml'
permissions:
  contents: read
jobs:
  frontend-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Community onboarding and prior-feature regression tests
        run: npm test -- --watch=false --browsers=ChromeHeadless --include=src/app/pages/communities/community-discovery-action.spec.ts --include=src/app/pages/community-create/community-invite-step.component.spec.ts --include=src/app/pages/community-create/community-create.component.spec.ts --include=src/app/pages/communities/community-group-invite.spec.ts --include=src/app/pages/communities/community-bulk-approval.spec.ts --include=src/app/pages/communities/community-value-proposition.spec.ts --include=src/app/pages/communities/communities.component.spec.ts
      - run: npm run build
