name: Archive reviewed divergent maintenance branches
on:
  push:
    branches: [develop]
    paths: [.github/workflows/archive-divergent-maintenance.yml]
permissions:
  contents: write
  pull-requests: read
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Preserve exact SHA before deleting branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error,urllib.parse
          repo=os.environ['REPO']
          items=[
            ('chore/archive-four-reviewed-qa-20261101','d2cb77ee8dd7dfdb734870ec566f6814fa5be3bb'),
            ('chore/safe-merged-branch-cleanup-20261030','6ba0a8b62debad8adc4c8b6b453629b4ecefefb1')
          ]
          def api(method,path,data=None):
              req=urllib.request.Request('https://api.github.com/repos/'+repo+path,method=method,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'},data=None if data is None else json.dumps(data).encode())
              with urllib.request.urlopen(req,timeout=30) as r:return json.loads(r.read() or b'{}')
          for name,sha in items:
              path=urllib.parse.quote(name,safe='/')
              assert api('GET','/git/ref/heads/'+path)['object']['sha']==sha,'branch moved'
              assert not api('GET','/pulls?state=open&head='+repo.split('/')[0]+':'+urllib.parse.quote(name,safe='')+'&per_page=100'),'open PR'
              tag='archive/divergent-preserved-20261102/'+name
              try:
                  assert api('GET','/git/ref/tags/'+tag)['object']['sha']==sha,'tag mismatch'
              except urllib.error.HTTPError as e:
                  if e.code!=404:raise
                  api('POST','/git/refs',{'ref':'refs/tags/'+tag,'sha':sha})
              assert api('GET','/git/ref/tags/'+tag)['object']['sha']==sha,'tag missing'
              assert api('GET','/git/ref/heads/'+path)['object']['sha']==sha,'branch changed'
              api('DELETE','/git/refs/heads/'+path)
              print('DIVERGENT_BRANCH_ARCHIVED',name,sha)
          PY
