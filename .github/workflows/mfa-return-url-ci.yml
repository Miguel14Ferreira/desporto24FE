name: Validate MFA return URL
on:
  pull_request:
    branches: [preview/render-fullstack]
    paths:
      - 'src/app/pages/login-mfa/**'
      - 'src/app/shared/safe-login-return-url.ts'
      - '.github/workflows/mfa-return-url-ci.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test -- --watch=false --browsers=ChromeHeadless --include=src/app/pages/login-mfa/login-mfa.component.spec.ts
      - run: npm run build
