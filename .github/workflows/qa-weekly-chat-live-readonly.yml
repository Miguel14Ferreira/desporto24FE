name: Jynlo QA - weekly community and chat Playwright (no TinyFish)

# Does not create sessions, send messages or alter rankings. Opens two existing
# QA inboxes; read receipts for those disposable accounts may be updated.
on:
  push:
    branches: [develop]
    paths:
      - 'scripts/qa/jynlo-weekly-chat-live-readonly.cjs'
      - '.github/workflows/qa-weekly-chat-live-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jynlo-weekly-chat-qa
  cancel-in-progress: false

jobs:
  weekly-chat-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      JYNLO_QA_PASSWORD_1: ${{ secrets.JYNLO_QA1_PASSWORD }}
      JYNLO_QA_PASSWORD_2: ${{ secrets.JYNLO_QA2_PASSWORD }}
      JYNLO_QA_USERNAME_1: ${{ secrets.JYNLO_QA1_USERNAME }}
      JYNLO_QA_USERNAME_2: ${{ secrets.JYNLO_QA2_USERNAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require pre-authorized test identities
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$JYNLO_QA_PASSWORD_1" || -z "$JYNLO_QA_PASSWORD_2" ]]; then
            echo 'QA secrets missing; not connecting to LIVE'
            exit 1
          fi
          if [[ "$JYNLO_QA_USERNAME_1" != 'jynloteste01' || "$JYNLO_QA_USERNAME_2" != 'jynloteste02' ]]; then
            echo 'QA accounts do not match allowlist; not connecting to LIVE'
            exit 1
          fi
      - name: Check read-only browser script syntax
        run: node --check scripts/qa/jynlo-weekly-chat-live-readonly.cjs
      - name: Install standalone Playwright Chromium
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/jynlo-playwright" \
            --no-save --no-audit --no-fund --package-lock=false playwright
          "$RUNNER_TEMP/jynlo-playwright/node_modules/.bin/playwright" install --with-deps chromium
      - name: Validate both existing weekly session chats and UI authorization
        shell: bash
        run: NODE_PATH="$RUNNER_TEMP/jynlo-playwright/node_modules" node scripts/qa/jynlo-weekly-chat-live-readonly.cjs
