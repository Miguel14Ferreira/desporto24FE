name: One-time verified security archive
on:
  push:
    branches:
      - chore/safe-merged-branch-cleanup-20261030
permissions:
  contents: write
  pull-requests: read
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Archive and delete exact-identical branches
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRODUCTION_BRANCH: preview/render-fullstack
          CANDIDATES: security/cross-tab-refresh-lock-20261024
        run: python3 scripts/cleanup_verified_qa_candidates.py
