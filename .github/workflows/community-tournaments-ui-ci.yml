name: Validate community tournament UI
# Manual diagnostic job; pull requests use the consolidated pr-validation.yml.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test -- --watch=false --browsers=ChromeHeadless --include=src/app/pages/communities/community-tournaments.component.spec.ts --include=src/app/services/community-tournaments.service.spec.ts
      - run: npm run build
