name: Validate public session participation
# Manual diagnostic job; pull requests use the consolidated pr-validation.yml.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test -- --watch=false --browsers=ChromeHeadless --include=src/app/pages/public-session-preview/public-session-preview.component.spec.ts
      - run: npm run build
