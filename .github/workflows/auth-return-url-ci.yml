name: Validate auth return URL
on:
  pull_request:
    branches: [preview/render-fullstack]
    paths:
      - 'src/app/auth.interceptor.ts'
      - 'src/app/auth.interceptor.spec.ts'
      - 'src/app/shared/safe-login-return-url.ts'
      - '.github/workflows/auth-return-url-ci.yml'
permissions:
  contents: read
jobs:
  frontend-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test -- --watch=false --browsers=ChromeHeadless --include=src/app/auth.interceptor.spec.ts
      - run: npm run build
