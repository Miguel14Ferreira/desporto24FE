name: Archive identical QA branches
on:
  push:
    branches:
      - chore/safe-merged-branch-cleanup-20261030
permissions:
  contents: write
  pull-requests: read
jobs:
  archive:
    if: "!contains(github.event.head_commit.message, '[qa archived]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Archive and delete exact-identical QA branches
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRODUCTION_BRANCH: preview/render-fullstack
          CANDIDATES: qa/community-tournaments-browser-proof-20261026,qa/concept-one-mobile-chromium-390-venues-20261026,qa/concept-one-populated-tournaments-permissions-20261026,qa/private-session-cleanup-resilience-20261023,test/qa-optional-email-resend-live-20261026
        run: python3 scripts/cleanup_verified_qa_candidates.py
