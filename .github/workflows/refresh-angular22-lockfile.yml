name: Refresh Angular 22 Lockfile

on:
  push:
    branches:
      - feature/desporto24-relaunch-develop
    paths:
      - .github/workflows/refresh-angular22-lockfile.yml

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/desporto24-relaunch-develop
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm

      - name: Regenerate package lock
        run: |
          rm -rf node_modules package-lock.json
          npm install --package-lock-only

      - name: Commit refreshed lockfile
        run: |
          git add package-lock.json
          git commit -m "build: refresh Angular 22 lockfile"
          git push origin HEAD:feature/desporto24-relaunch-develop
