name: Validate Discover session expansion

on:
  pull_request:
    branches: [preview/render-fullstack]
    paths:
      - 'src/app/pages/discover/**'
      - '.github/workflows/discover-sessions-ci.yml'

permissions:
  contents: read

jobs:
  angular-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
