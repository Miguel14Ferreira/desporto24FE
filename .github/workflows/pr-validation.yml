# One complete Angular verification per pull request instead of overlapping
# npm installs, test subsets and production builds from feature-specific jobs.
# Draft PRs remain inexpensive; validate once they are ready for review.
name: Jynlo FE PR validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [preview/render-fullstack]
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'angular.json'
      - 'tsconfig*.json'
      - 'Dockerfile'
      - '.github/workflows/pr-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fe-pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Angular tests and build
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies once
        run: npm ci
      - name: Run all Angular unit and regression tests
        run: npm test -- --watch=false --browsers=ChromeHeadless
      - name: Build frontend once
        run: npm run build
      # Opt-in browser regression for the unread-indicator fix only.
      # Two fully synthetic accounts share in-memory API state; no prod writes,
      # credentials, extra CI job or Chromium download.
      - name: Install Playwright for inbox dual-browser regression
        if: ${{ startsWith(github.head_ref, 'fix/inbox-persistent-unread-badge-') }}
        run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - name: Check persisted unread across two isolated browser contexts
        if: ${{ startsWith(github.head_ref, 'fix/inbox-persistent-unread-badge-') }}
        env:
          JYNLO_USE_SYSTEM_CHROME: '1'
        run: npx playwright test e2e/inbox-read-sync.spec.ts --config=playwright.config.ts --project=desktop-chromium
      # Historical-search browser QA runs in this same job, using two separate
      # in-memory identities. All external API/WebSocket traffic is intercepted.
      - name: Add Playwright for historical search browser contract
        if: ${{ startsWith(github.head_ref, 'qa/inbox-history-search-') }}
        run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - name: Exercise historical search in two browser contexts
        if: ${{ startsWith(github.head_ref, 'qa/inbox-history-search-') }}
        env:
          JYNLO_USE_SYSTEM_CHROME: '1'
        run: npx playwright test e2e/inbox-history-search.spec.ts --config=playwright.config.ts --project=desktop-chromium
      # Full two-browser contract for the single inbox, deep links, membership
      # and automatic kick-off closure. Synthetic accounts; no live credentials
      # or production traffic. Keep this in the existing Angular CI job.
      - name: Add Playwright for unified inbox browser flow
        if: ${{ startsWith(github.head_ref, 'qa/unified-inbox-browser-flow-') }}
        run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - name: Verify unified chat with two independent browsers
        if: ${{ startsWith(github.head_ref, 'qa/unified-inbox-browser-flow-') }}
        env:
          JYNLO_USE_SYSTEM_CHROME: '1'
        run: npx playwright test e2e/inbox-read-sync.spec.ts e2e/inbox-history-search.spec.ts --config=playwright.config.ts --project=desktop-chromium
      # Verify real Angular DOM ✓ / ✓✓ against two separate mocked identities.
      # GitHub Actions never receives QA credentials or contacts production.
      - name: Install Playwright for read-indicator browser contract
        if: ${{ startsWith(github.head_ref, 'qa/read-indicators-') }}
        run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - name: Confirm sender, recipient and account-switch read indicators
        if: ${{ startsWith(github.head_ref, 'qa/read-indicators-') }}
        env:
          JYNLO_USE_SYSTEM_CHROME: '1'
        run: npx playwright test e2e/inbox-read-sync.spec.ts --config=playwright.config.ts --project=desktop-chromium --grep "blue checks follow recipient read cursor"
      # Recheck only foreground chat reading and recipient receipts using two
      # real Chromium browser contexts with completely synthetic backend state.
      - name: Install Playwright for foreground read regression
        if: ${{ startsWith(github.head_ref, 'fix/chat-read-visible-active-') }}
        run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - name: Verify inactive-tab reads and fast recipient receipts
        if: ${{ startsWith(github.head_ref, 'fix/chat-read-visible-active-') }}
        env:
          JYNLO_USE_SYSTEM_CHROME: '1'
        run: npx playwright test e2e/inbox-read-sync.spec.ts --config=playwright.config.ts --project=desktop-chromium --grep "blue checks follow|background recipient tab"
      # Direct read receipts: two fully simulated browser identities and a
      # committed socket event; no credentials or production API calls.
      - name: Install Playwright for instant confirmed read regression
        if: ${{ startsWith(github.head_ref, 'feature/chat-confirmed-read-websocket-') }}
        run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - name: Verify ✓/✓✓ before and immediately after server confirmation
        if: ${{ startsWith(github.head_ref, 'feature/chat-confirmed-read-websocket-') }}
        env:
          JYNLO_USE_SYSTEM_CHROME: '1'
        run: npx playwright test e2e/inbox-read-sync.spec.ts --config=playwright.config.ts --project=desktop-chromium --grep "blue checks follow"
      # Two independent Chromium contexts of the SAME account: a read on one
      # instantly synchronizes the other's unread count via committed WebSocket.
      # All APIs and sockets are synthetic; never use production credentials.
      - name: Install Playwright for cross-device unread synchronization
        if: ${{ startsWith(github.head_ref, 'feature/chat-own-read-sync-') }}
        run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - name: Verify own read synchronization across isolated browsers
        if: ${{ startsWith(github.head_ref, 'feature/chat-own-read-sync-') }}
        env:
          JYNLO_USE_SYSTEM_CHROME: '1'
        run: npx playwright test e2e/inbox-read-sync.spec.ts --config=playwright.config.ts --project=desktop-chromium --grep "two devices of the same account|blue checks follow"
      # Browser regression: own sent message reaches the sender's second
      # signed-in context and recipient using the same committed server ID.
      # All HTTP and WebSocket traffic intercepted; no production credentials.
      - name: Install Playwright for outgoing multi-device message QA
        if: ${{ startsWith(github.head_ref, 'qa/chat-sender-multidevice-') }}
        run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - name: Verify outgoing message mirror and no duplicate bubbles
        if: ${{ startsWith(github.head_ref, 'qa/chat-sender-multidevice-') }}
        env:
          JYNLO_USE_SYSTEM_CHROME: '1'
        run: npx playwright test e2e/inbox-read-sync.spec.ts --config=playwright.config.ts --project=desktop-chromium --grep "sent direct message mirrors|blue checks follow"
      # Outage recovery: one authenticated Chromium client, all remote APIs
      # and sockets mocked. Verify missed history plus new friend discovery.
      - name: Install Playwright for offline reconnection regression
        if: ${{ startsWith(github.head_ref, 'fix/inbox-offline-recovery-') }}
        run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - name: Verify reconnect recovery, read checks and deduplication
        if: ${{ startsWith(github.head_ref, 'fix/inbox-offline-recovery-') }}
        env:
          JYNLO_USE_SYSTEM_CHROME: '1'
        run: npx playwright test e2e/inbox-read-sync.spec.ts --config=playwright.config.ts --project=desktop-chromium --grep "WebSocket outage recovers|blue checks follow"
      # Pending-send navigation contract: keep each async HTTP response on its
      # originating thread. All HTTP/WebSocket responses are synthetic.
      - name: Install Playwright for pending-send navigation regression
        if: ${{ startsWith(github.head_ref, 'fix/chat-switch-pending-send-') }}
        run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - name: Verify delayed send, independent drafts and no duplicate POST
        if: ${{ startsWith(github.head_ref, 'fix/chat-switch-pending-send-') }}
        env:
          JYNLO_USE_SYSTEM_CHROME: '1'
        run: npx playwright test e2e/inbox-read-sync.spec.ts --config=playwright.config.ts --project=desktop-chromium --grep "switching chats during a pending send|sent direct message mirrors"
      # Deterministic committed-WebSocket-versus-lost-HTTP regression.
      # Browser + fake API/socket are fully isolated from production.
      - name: Install Playwright for off-screen delivery confirmation
        if: ${{ startsWith(github.head_ref, 'fix/chat-confirm-offscreen-delivery-') }}
        run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - name: Verify committed delivery, late HTTP error and duplicate protection
        if: ${{ startsWith(github.head_ref, 'fix/chat-confirm-offscreen-delivery-') }}
        env:
          JYNLO_USE_SYSTEM_CHROME: '1'
        run: npx playwright test e2e/inbox-read-sync.spec.ts --config=playwright.config.ts --project=desktop-chromium --grep "off-screen WebSocket confirmation|switching chats during a pending send"
      # Candidate-only browser verification. No additional job, second npm ci,
      # Render deployment, production credentials or production API requests.
      - name: Install Chromium for integrated desktop smoke
        if: ${{ github.head_ref == 'integration/desktop-pestana-20261020' }}
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Exercise built Angular candidate in desktop Chromium
        if: ${{ github.head_ref == 'integration/desktop-pestana-20261020' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci-browser/spa_server.py dist/desporto24 4173 > /tmp/jynlo-spa.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:4173/; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            cat /tmp/jynlo-spa.log
            exit 1
          fi
          node scripts/ci-browser/desktop_candidate_smoke.cjs
          node scripts/ci-browser/desktop_auth_smoke.cjs
      - name: Check live public API response contracts (GET only)
        if: ${{ github.head_ref == 'integration/desktop-pestana-20261020' }}
        # No credentials, POST, writes, production E2E actions or database access.
        # This checks only the existing public API, with bounded responses.
        run: node scripts/ci-browser/public_api_contract_READONLY.cjs
      - name: Save isolated candidate screenshots
        if: ${{ always() && github.head_ref == 'integration/desktop-pestana-20261020' }}
        uses: actions/upload-artifact@v4
        with:
          name: jynlo-desktop-candidate-screenshots
          path: artifacts/desktop-candidate/*.png
          retention-days: 3
          if-no-files-found: warn
