name: Jynlo QA - provision synthetic standings

# One-time controlled fixture for disposable QA accounts only.
# Never reports results for real or future sports sessions.
on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/qa-provision-standings.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jynlo-qa-synthetic-standings
  cancel-in-progress: false

jobs:
  provision:
    if: >-
      github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'qa(standings): provision synthetic football round once'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      JYNLO_QA_PASSWORD_1: ${{ secrets.JYNLO_QA1_PASSWORD }}
      JYNLO_QA_PASSWORD_2: ${{ secrets.JYNLO_QA2_PASSWORD }}
      JYNLO_QA_USERNAME_1: ${{ secrets.JYNLO_QA1_USERNAME }}
      JYNLO_QA_USERNAME_2: ${{ secrets.JYNLO_QA2_USERNAME }}
      JYNLO_QA_STANDINGS_CONSENT: QA_CREATE_SYNTHETIC_STANDINGS_ONCE
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check controlled QA script syntax
        run: node --check scripts/qa/jynlo-provision-qa-standings.cjs
      - name: Create or reuse QA season and simulated round
        run: node scripts/qa/jynlo-provision-qa-standings.cjs
