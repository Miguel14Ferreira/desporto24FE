name: Jynlo QA - synthetic Karting championship scoring

# One guarded production QA fixture, no actual racing activity, no real users.
on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/qa-karting-race-fixture.yml'
  workflow_dispatch:
  # Re-run after adding compatibility with the older LIVE API response.

permissions:
  contents: read

concurrency:
  group: jynlo-qa-karting-race-once
  cancel-in-progress: false

jobs:
  karting:
    if: >-
      github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'qa(karting): provision synthetic race and verify points once'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      JYNLO_QA_PASSWORD_1: ${{ secrets.JYNLO_QA1_PASSWORD }}
      JYNLO_QA_PASSWORD_2: ${{ secrets.JYNLO_QA2_PASSWORD }}
      JYNLO_QA_USERNAME_1: ${{ secrets.JYNLO_QA1_USERNAME }}
      JYNLO_QA_USERNAME_2: ${{ secrets.JYNLO_QA2_USERNAME }}
      JYNLO_QA_KARTING_CONSENT: QA_CREATE_SYNTHETIC_KARTING_RACE_ONCE
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate guarded script syntax
        run: node --check scripts/qa/jynlo-provision-karting-race.cjs
      - name: Create or reuse synthetic Karting race and verify split standings
        run: node scripts/qa/jynlo-provision-karting-race.cjs
