name: Jynlo QA - provision one private multisport community

# Controlled LIVE QA fixture: disposable accounts, no real fixtures or results.
on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/qa-provision-multisport-community.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jynlo-qa-multisport-provision-once
  cancel-in-progress: false

jobs:
  provision:
    if: >-
      github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'qa(communities): create controlled multisport QA group once'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      JYNLO_QA_PASSWORD_1: ${{ secrets.JYNLO_QA1_PASSWORD }}
      JYNLO_QA_PASSWORD_2: ${{ secrets.JYNLO_QA2_PASSWORD }}
      JYNLO_QA_USERNAME_1: ${{ secrets.JYNLO_QA1_USERNAME }}
      JYNLO_QA_USERNAME_2: ${{ secrets.JYNLO_QA2_USERNAME }}
      JYNLO_QA_PROVISION_CONSENT: QA_MULTISPORT_COMMUNITY_CREATE_ONCE
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check guarded QA script syntax
        run: node --check scripts/qa/jynlo-provision-multisport-community.cjs
      - name: Create or reuse private Futebol and Karting test group
        run: node scripts/qa/jynlo-provision-multisport-community.cjs
