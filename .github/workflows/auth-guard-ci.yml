name: Validate authentication guard
on:
  pull_request:
    branches: [preview/render-fullstack]
    paths:
      - 'src/app/guard/authentication.guard.ts'
      - 'src/app/guard/authentication.guard.spec.ts'
      - '.github/workflows/auth-guard-ci.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test -- --watch=false --browsers=ChromeHeadless --include=src/app/guard/authentication.guard.spec.ts
      - run: npm run build
