name: Archive four verified merged QA maintenance branches
on:
  push:
    branches: [develop]
    paths: [.github/workflows/archive-four-qa-maintenance.yml]
permissions:
  contents: write
  pull-requests: read
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Verify and archive exact reviewed heads
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error,urllib.parse
          targets=json.loads('[{"branch":"chore/qa-audit-line-diff-20261102","sha":"3e5d9479d04fc25e71263fd97ebec3a03a191cbe"},{"branch":"chore/run-qa-audit-20261101","sha":"1c408c370d077f930d535981aa2aa89dcd8a5790"},{"branch":"fix/qa-audit-regex-20261101","sha":"2dd4a2fb6d9e4971e4cd26c95d3e57859fd25f72"},{"branch":"chore/qa-equivalence-audit-20261101","sha":"ac0645865856467d0eda3d941dc21073976696ca"}]')
          repo=os.environ['REPO']
          def api(method,path,data=None):
              req=urllib.request.Request('https://api.github.com/repos/'+repo+path,method=method,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'},data=None if data is None else json.dumps(data).encode())
              with urllib.request.urlopen(req,timeout=30) as r:return json.loads(r.read() or b'{}')
          for item in targets:
              name,sha=item['branch'],item['sha']
              assert name not in ('develop','master','preview/render-fullstack') and not name.startswith('feature/'), 'protected'
              path=urllib.parse.quote(name,safe='/')
              assert api('GET','/git/ref/heads/'+path)['object']['sha']==sha,'SHA changed'
              compare=api('GET','/compare/'+sha+'...develop')
              assert compare['behind_by']==0,'not merged'
              assert not api('GET','/pulls?state=open&head='+repo.split('/')[0]+':'+urllib.parse.quote(name,safe='')+'&per_page=100'),'open PR'
              tag='archive/verified-20261102/'+name
              try:
                  assert api('GET','/git/ref/tags/'+tag)['object']['sha']==sha,'tag mismatch'
              except urllib.error.HTTPError as e:
                  if e.code!=404:raise
                  api('POST','/git/refs',{'ref':'refs/tags/'+tag,'sha':sha})
              assert api('GET','/git/ref/tags/'+tag)['object']['sha']==sha,'tag not verified'
              assert api('GET','/git/ref/heads/'+path)['object']['sha']==sha,'branch moved'
              api('DELETE','/git/refs/heads/'+path)
              print('ARCHIVED_AND_DELETED',name,sha)
          PY
