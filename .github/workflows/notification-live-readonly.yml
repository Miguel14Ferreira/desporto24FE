name: Jynlo LIVE notification QA (read-only, manual)
# Opt-in. Requires two existing protected GitHub Actions secrets for disposable QA accounts.
# This workflow never changes preferences, creates invitations, sends email,
# joins sessions, or sends messages. Login POST only; all other LIVE requests GET.
on:
  workflow_dispatch:
    inputs:
      require_session_details:
        description: 'Fail if both QA accounts have no existing session details to inspect'
        type: boolean
        required: false
        default: false
      require_community_coverage:
        description: 'Fail when QA accounts have no community sessions to inspect'
        type: boolean
        required: false
        default: false
      require_recurring_coverage:
        description: 'Fail unless a recurring QA session is actually observed'
        type: boolean
        required: false
        default: false
permissions:
  contents: read
concurrency:
  group: jynlo-notifications-live-readonly
  cancel-in-progress: false
jobs:
  readonly-notifications:
    name: Read-only QA notification consistency and ownership
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      JYNLO_QA_PASSWORD_1: ${{ secrets.JYNLO_QA1_PASSWORD }}
      JYNLO_QA_PASSWORD_2: ${{ secrets.JYNLO_QA2_PASSWORD }}
      JYNLO_QA_USERNAME_1: ${{ secrets.JYNLO_QA1_USERNAME }}
      JYNLO_QA_USERNAME_2: ${{ secrets.JYNLO_QA2_USERNAME }}
      JYNLO_QA_REQUIRE_SESSION_DETAILS: ${{ inputs.require_session_details }}
      JYNLO_QA_REQUIRE_COMMUNITY_COVERAGE: ${{ inputs.require_community_coverage }}
      JYNLO_QA_REQUIRE_RECURRING_COVERAGE: ${{ inputs.require_recurring_coverage }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm protected QA secrets belong to allowed disposable identities
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$JYNLO_QA_PASSWORD_1" || -z "$JYNLO_QA_PASSWORD_2" ]]; then
            echo 'Protected QA password secrets unavailable; no LIVE login attempted.' >&2
            exit 1
          fi
          if [[ "$JYNLO_QA_USERNAME_1" != 'jynloteste01' || "$JYNLO_QA_USERNAME_2" != 'jynloteste02' ]]; then
            echo 'QA secret usernames differ from strictly allowed disposable test accounts; no LIVE login attempted.' >&2
            exit 1
          fi
      - name: Verify that the QA runner cannot perform writes
        run: node --test scripts/qa/jynlo-notifications-live-readonly.test.cjs
      - name: Probe two disposable QA accounts without modifying notifications
        run: node scripts/qa/jynlo-notifications-live-readonly.cjs
      - name: Validate guarded read-only session runner with synthetic responses
        run: node --test scripts/qa/jynlo-sessions-live-readonly.test.cjs
      - name: Read authorized QA session lists and details from LIVE API (GET only after login)
        run: node scripts/qa/jynlo-sessions-live-readonly.cjs
      - name: Validate read-only community/session ownership contracts with synthetic responses
        run: node --test scripts/qa/jynlo-communities-live-readonly.test.cjs
      - name: Read only QA-owned community and recurring-session views from LIVE API
        run: node scripts/qa/jynlo-communities-live-readonly.cjs
