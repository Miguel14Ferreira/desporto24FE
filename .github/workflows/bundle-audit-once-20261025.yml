name: Jynlo one-off bundle composition audit

on:
  push:
    branches: [perf/bundle-audit-20261025]
    paths:
      - '.github/workflows/bundle-audit-once-20261025.yml'
      - 'src/app/**'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exact audited dependencies
        run: npm ci --no-fund
      - name: Build bundle stats using production settings
        run: npm run build -- --stats-json
      - name: Report initial size, lazy chunks and major modules
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const root='dist/desporto24';
          const files=fs.readdirSync(root);
          console.log('DIST_Files',files.filter(x=>x.endsWith('.js')||x.endsWith('.css')).map(x=>({name:x,size:fs.statSync(path.join(root,x)).size})).sort((a,b)=>b.size-a.size).slice(0,50));
          const statFile=files.find(x=>x==='stats.json');
          if (!statFile) throw Error('Angular --stats-json produced no stats.json');
          const j=JSON.parse(fs.readFileSync(path.join(root,statFile),'utf8'));
          console.log('STATS_FORMAT',Object.keys(j).slice(0,30));
          console.log('STATS_COUNTS',{assets:j.assets?.length,chunks:j.chunks?.length,modules:j.modules?.length,outputs:j.outputs&&Object.keys(j.outputs).length});
          if (Array.isArray(j.assets)) console.log('TOP_ASSETS',j.assets.filter(a=>/\.js$|\.css$/.test(a.name)).sort((a,b)=>b.size-a.size).slice(0,35).map(a=>({name:a.name,size:a.size,initial:a.isInitial||a.info?.initial||false})));
          if(Array.isArray(j.chunks)) console.log('TOP_CHUNKS',j.chunks.sort((a,b)=>b.size-a.size).slice(0,35).map(c=>({id:c.id,names:c.names,files:c.files,initial:c.initial,size:c.size,entry:c.entry,modules:c.modules?.length})));
          if(Array.isArray(j.modules)){
             const mods=j.modules.flatMap(m=>m.modules||[m]);
             console.log('TOP_MODULES',mods.sort((a,b)=>b.size-a.size).slice(0,70).map(m=>({name:m.name,size:m.size,chunks:m.chunks})));
             const groups={};
             for(const m of mods) {const name=m.name||''; const key=name.includes('node_modules/')?name.split('node_modules/')[1].split('/').slice(0,name.includes('node_modules/@')?2:1).join('/'):name.split('/').slice(0,6).join('/');groups[key]=(groups[key]||0)+(m.size||0);}
             console.log('BIG_GROUPS',Object.entries(groups).sort((a,b)=>b[1]-a[1]).slice(0,40));
          }
          if(j.outputs) {
            const outputs=Object.entries(j.outputs);
            console.log('ESBUILD_OUTPUTS',outputs.map(([name,o])=>({name,bytes:o.bytes,inputs:Object.keys(o.inputs||{}).length})).sort((a,b)=>b.bytes-a.bytes).slice(0,45));
            const entries=outputs.filter(([name,o])=>name.endsWith('.js')&&o.entryPoint);
            for(const [name,o] of entries.sort((a,b)=>b[1].bytes-a[1].bytes).slice(0,12)) {
              console.log('OUTPUT_INPUTS',name,Object.entries(o.inputs||{}).sort((a,b)=>b[1].bytesInOutput-a[1].bytesInOutput).slice(0,20));
            }
          }
          NODE
