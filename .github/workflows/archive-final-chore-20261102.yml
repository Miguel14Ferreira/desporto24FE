name: Archive final merged chore branch
on:
  push:
    branches: [develop]
    paths: [.github/workflows/archive-final-chore-20261102.yml]
permissions:
  contents: write
  pull-requests: read
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Archive fully merged branch with verified recovery tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error
          repo=os.environ['REPO']
          name='chore/archive-divergent-maintenance-20261102'
          sha='72e1da56f2ac4bc7a12b0c5dea4b4a6f18ee7b13'
          def api(method,path,data=None):
              req=urllib.request.Request('https://api.github.com/repos/'+repo+path,method=method,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'},data=None if data is None else json.dumps(data).encode())
              with urllib.request.urlopen(req,timeout=30) as r:return json.loads(r.read() or b'{}')
          assert api('GET','/git/ref/heads/'+name)['object']['sha']==sha
          c=api('GET','/compare/'+sha+'...develop')
          assert c['behind_by']==0 and c['status'] in ('ahead','identical')
          assert not api('GET','/pulls?state=open&head='+repo.split('/')[0]+':'+name+'&per_page=100')
          tag='archive/verified-20261102/'+name
          try:
              assert api('GET','/git/ref/tags/'+tag)['object']['sha']==sha
          except urllib.error.HTTPError as e:
              if e.code!=404:raise
              api('POST','/git/refs',{'ref':'refs/tags/'+tag,'sha':sha})
          assert api('GET','/git/ref/tags/'+tag)['object']['sha']==sha
          assert api('GET','/git/ref/heads/'+name)['object']['sha']==sha
          api('DELETE','/git/refs/heads/'+name)
          print('ARCHIVED_AND_DELETED',name,sha)
          PY
