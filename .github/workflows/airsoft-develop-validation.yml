name: Jynlo Airsoft develop validation

on:
  push:
    branches: [develop]
    paths:
      - 'src/app/pages/events2/events2.component.ts'
      - 'src/app/pages/events2/events2.component.html'
      - 'src/app/pages/events2/events2.component.spec.ts'
      - 'src/app/pages/session-details/session-details.component.spec.ts'
      - 'src/app/shared/sports-catalog.ts'
      - 'src/app/pages/community-create/community-create.component.html'
      - 'src/app/pages/community-create/community-create.component.spec.ts'
      - 'src/app/i18n/i18n.service.ts'
      - 'src/app/i18n/translations-en.ts'
      - '.github/workflows/airsoft-develop-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: airsoft-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Airsoft regressions and production build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run complete Angular regression suite
        run: npm test -- --watch=false --browsers=ChromeHeadless
      - name: Build production frontend
        run: npm run build
