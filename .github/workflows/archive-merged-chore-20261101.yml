name: Archive merged chore branches 2026-11-01
on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths: [.github/workflows/archive-merged-chore-20261101.yml]
permissions:
  contents: write
  pull-requests: read
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Verify ancestry, archive SHAs, and delete reviewed refs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          repo=os.environ['REPOSITORY']
          names=["chore/align-karting-readonly-workflow-develop-20261101","chore/archive-ancestor-perf-branches-20261101","chore/archive-content-equivalent-qa-20261101","chore/archive-karting-qa-safe-20261101","chore/archive-next-reviewed-qa-20261101","chore/archive-reviewed-qa-batch-20261101","chore/archive-six-ancestor-perf-20261101","chore/restore-live-guest-readonly-qa-20261101","chore/reviewed-qa-archive-clean-20261101"]
          def api(method,path,data=None):
              req=urllib.request.Request('https://api.github.com/repos/'+repo+path,method=method,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'},data=None if data is None else json.dumps(data).encode())
              with urllib.request.urlopen(req,timeout=30) as response:
                  return json.loads(response.read() or b'{}')
          for name in names:
              try:
                  ref=api('GET','/git/ref/heads/'+name)
              except urllib.error.HTTPError as e:
                  if e.code==404:
                      print('ALREADY_ABSENT',name)
                      continue
                  raise
              sha=ref['object']['sha']
              comparison=api('GET','/compare/'+sha+'...develop')
              assert comparison['behind_by']==0, (name,'not an ancestor of develop',comparison['behind_by'])
              assert comparison['status'] in ('ahead','identical'), (name,comparison['status'])
              prs=api('GET','/pulls?state=open&head='+repo.split('/')[0]+':'+name+'&per_page=100')
              assert not prs, (name,'open pull requests')
              tag='archive/merged-chore-20261101/'+name
              try:
                  existing=api('GET','/git/ref/tags/'+tag)
                  assert existing['object']['sha']==sha, (name,'tag mismatch')
              except urllib.error.HTTPError as e:
                  if e.code!=404: raise
                  api('POST','/git/refs',{'ref':'refs/tags/'+tag,'sha':sha})
              confirmed=api('GET','/git/ref/tags/'+tag)
              assert confirmed['object']['sha']==sha
              latest=api('GET','/git/ref/heads/'+name)
              assert latest['object']['sha']==sha, (name,'branch moved')
              assert not api('GET','/pulls?state=open&head='+repo.split('/')[0]+':'+name+'&per_page=100')
              api('DELETE','/git/refs/heads/'+name)
              print('ARCHIVED_AND_DELETED',name,sha)
          PY
