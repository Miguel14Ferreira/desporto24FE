name: Validate community invitation registration return
on:
  pull_request:
    branches: [preview/render-fullstack]
    paths:
      - 'src/app/shared/registration-return-url.ts'
      - 'src/app/shared/registration-return-url.spec.ts'
      - 'src/app/app.component.spec.ts'
      - 'src/app/pages/createaccount/createaccount.component.spec.ts'
      - 'src/app/shared/safe-login-return-url.spec.ts'
      - '.github/workflows/community-registration-return-ci.yml'
permissions:
  contents: read
jobs:
  frontend-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test -- --watch=false --browsers=ChromeHeadless --include=src/app/shared/registration-return-url.spec.ts --include=src/app/shared/safe-login-return-url.spec.ts --include=src/app/app.component.spec.ts --include=src/app/pages/createaccount/createaccount.component.spec.ts --include=src/app/pages/community-create/community-invite-step.component.spec.ts
      - run: npm run build
