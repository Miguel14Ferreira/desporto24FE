name: Archive and delete exact obsolete audit branches
on:
  workflow_dispatch:
    inputs:
      qa_expected_sha_1:
        description: 'Expected 40-character SHA for reviewed QA branch 1 (required for QA archive modes)'
        required: false
        type: string
      qa_expected_sha_2:
        description: 'Expected 40-character SHA for reviewed QA branch 2 (required for QA archive modes)'
        required: false
        type: string
      qa_expected_sha_3:
        description: 'Expected 40-character SHA for reviewed QA branch 3 (required for QA archive modes)'
        required: false
        type: string
      qa_expected_sha_4:
        description: 'Expected 40-character SHA for reviewed QA branch 4 (required for QA archive modes)'
        required: false
        type: string
      confirmation:
        description: 'DRY_RUN or ARCHIVE_AND_DELETE_EXACT_AUDITS'
        required: true
        default: DRY_RUN
        type: choice
        options:
          - DRY_RUN
          - AUDIT_MERGED_CANDIDATES
          - QA_ARCHIVE_DRY_RUN
          - QA_ARCHIVE_AND_DELETE
          - QA_EQUIVALENCE_AUDIT
          - PERF_ANCESTOR_DRY_RUN
          - PERF_ANCESTOR_ARCHIVE_AND_DELETE
          - BATCH_DRY_RUN
          - BATCH_ARCHIVE_AND_DELETE
          - ARCHIVE_AND_DELETE_EXACT_AUDITS
permissions:
  contents: write
  pull-requests: read
concurrency:
  group: archive-exact-stale-audit-branches
  cancel-in-progress: false
jobs:
  archive-audits:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify checked-out revision equals dispatch SHA
        env:
          EXPECTED_RUN_SHA: ${{ github.sha }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          echo "PINNED_RUN_SHA=$actual_sha"
          test "$actual_sha" = "$EXPECTED_RUN_SHA"
      - name: Validate safety tests before any mutation
        run: |
          python3 -m py_compile scripts/archive_stale_audit_branches.py scripts/test_archive_stale_audit_branches.py
          python3 -m unittest discover -s scripts -p 'test_archive_stale_audit_branches.py' -v
      - name: Dry run or archive and delete pinned audit branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONFIRM_DELETE: ${{ inputs.confirmation }}
          DISCOVER_MERGED_CANDIDATES: ${{ inputs.confirmation == 'AUDIT_MERGED_CANDIDATES' && '1' || '0' }}
          BATCH_MERGED_MODE: ${{ inputs.confirmation }}
          QA_EXPECTED_SHA_1: ${{ inputs.qa_expected_sha_1 }}
          QA_EXPECTED_SHA_2: ${{ inputs.qa_expected_sha_2 }}
          QA_EXPECTED_SHA_3: ${{ inputs.qa_expected_sha_3 }}
          QA_EXPECTED_SHA_4: ${{ inputs.qa_expected_sha_4 }}
        run: python3 scripts/archive_stale_audit_branches.py
