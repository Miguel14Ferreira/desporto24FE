name: Jynlo dependency security triage (isolated)

on:
  push:
    branches: [security/dependency-audit-20261025]
    paths:
      - '.github/workflows/dep-audit-20261025.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jynlo-dependency-security-triage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-triage:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Propose compatible vulnerability fixes to isolated branch
        if: "${{ github.event_name == 'push' && github.event.head_commit.message == 'ci(security): propose compatible lockfile fixes' }}"
        shell: bash
        run: |
          set -euo pipefail
          echo 'Applying semver-compatible dependency fixes only, without npm scripts.'
          npm audit fix --package-lock-only --ignore-scripts --no-fund || true
          if git diff --quiet -- package.json package-lock.json; then
            echo 'No compatible lockfile changes.'
            exit 1
          fi
          git diff --stat -- package.json package-lock.json
          git diff -- package.json | head -60
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package.json package-lock.json
          git commit -m "fix(deps): apply non-breaking npm security lockfile updates"
          git push origin HEAD:refs/heads/security/dependency-audit-20261025

      - name: Sync targeted runtime dependency fixes
        if: "${{ github.event_name == 'push' && github.event.head_commit.message == 'chore(security): request targeted runtime dependency updates' }}"
        shell: bash
        run: |
          set -euo pipefail
          # 'send' is a Node static-file server library; it must not be used by our code.
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const roots = ['src', 'scripts', 'e2e'];
          const rx = /(?:from\s*|require\s*\(|import\s*\()\s*['"]send['"]/;
          const hits = [];
          function scan(dir) {
            if (!fs.existsSync(dir)) return;
            for (const e of fs.readdirSync(dir, {withFileTypes: true})) {
              const file = path.join(dir,e.name);
              if (e.isDirectory()) scan(file);
              else if (/\.(?:[cm]?js|ts)$/.test(e.name) && rx.test(fs.readFileSync(file,'utf8'))) hits.push(file);
            }
          }
          roots.forEach(scan);
          if (hits.length) {
            console.error('Direct send imports exist; abort removal:', hits.join(', '));
            process.exit(1);
          }
          console.log('No direct send imports in source, scripts or E2E.');
          NODE
          npm install --package-lock-only --ignore-scripts --no-fund --no-audit \
            @angular/animations@22.2.3 \
            @angular/common@22.2.3 \
            @angular/compiler@22.2.3 \
            @angular/core@22.2.3 \
            @angular/forms@22.2.3 \
            @angular/platform-browser@22.2.3 \
            @angular/platform-browser-dynamic@22.2.3 \
            @angular/router@22.2.3 \
            @angular/compiler-cli@22.2.3
          git diff --stat -- package.json package-lock.json
          node -e "const p=require('./package-lock.json').packages; if(p['node_modules/send'])process.exit(1); const v=p['node_modules/@angular/router']?.version; if(!v || Number(v.split('.')[0])!==22 || v==='22.2.0') process.exit(2); console.log('Resolved safe Angular router:',v)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package.json package-lock.json
          git commit -m "fix(deps): lock patched Angular router and remove unused send"
          git push origin HEAD:refs/heads/security/dependency-audit-20261025

      - name: Audit lockfile (all dependencies and production only)
        shell: bash
        run: |
          set -euo pipefail
          # Audit advisories without installing build dependencies or touching production.
          npm audit --package-lock-only --json > "$RUNNER_TEMP/npm-all.json" || true
          npm audit --omit=dev --package-lock-only --json > "$RUNNER_TEMP/npm-prod.json" || true
          node - "$RUNNER_TEMP/npm-all.json" "$RUNNER_TEMP/npm-prod.json" <<'NODE'
          const fs = require('fs');
          function render(file, label) {
            const audit = JSON.parse(fs.readFileSync(file, 'utf8'));
            console.log('=== ' + label + ' ===');
            console.log('TOTAL COUNTS', JSON.stringify(audit.metadata?.vulnerabilities || {}));
            const entries = Object.entries(audit.vulnerabilities || {});
            for (const [name, v] of entries.sort((a,b) => 
              ['critical','high','moderate','low'].indexOf(a[1].severity) - ['critical','high','moderate','low'].indexOf(b[1].severity))) {
              const via = (v.via || []).map(x => typeof x === 'string' ? x : 
                `${x.name || name}:${x.source || '?'}:${x.title || '?'}:${x.range || '?'}`);
              const fix = v.fixAvailable === false ? false : 
                (v.fixAvailable === true ? true : {name:v.fixAvailable?.name,version:v.fixAvailable?.version,isSemVerMajor:v.fixAvailable?.isSemVerMajor});
              console.log('ADVISORY', JSON.stringify({name, severity:v.severity, isDirect:v.isDirect, range:v.range, via, fix, effects:v.effects || []}));
            }
            if (!audit.metadata?.vulnerabilities) throw new Error('audit output missing metadata');
          }
          render(process.argv[2], 'ALL');
          render(process.argv[3], 'PRODUCTION-ONLY');
          NODE
