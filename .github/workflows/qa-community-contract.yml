name: Jynlo QA community contract (synthetic only)

on:
  push:
    branches: [develop]
    paths:
      - 'scripts/qa/jynlo-communities-live-readonly.cjs'
      - 'scripts/qa/jynlo-communities-live-readonly.test.cjs'
      - '.github/workflows/qa-community-contract.yml'
  pull_request:
    branches: [develop]
    paths:
      - 'scripts/qa/jynlo-communities-live-readonly.cjs'
      - 'scripts/qa/jynlo-communities-live-readonly.test.cjs'
      - '.github/workflows/qa-community-contract.yml'

permissions:
  contents: read

jobs:
  qa-community-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse LIVE runner and its synthetic tests
        run: |
          node --check scripts/qa/jynlo-communities-live-readonly.cjs
          node --check scripts/qa/jynlo-communities-live-readonly.test.cjs
      - name: Test community authorization and cross-posting with synthetic responses
        run: node --test scripts/qa/jynlo-communities-live-readonly.test.cjs
