name: Jynlo QA - provision one private test community

# Explicit authorization for one private QA community with two disposable users.
# Only runs automatically for the uniquely named setup commit; subsequent
# changes to this workflow or script do not trigger further production writes.
on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/qa-provision-private-community.yml'
    # Job-level commit-message guard prevents future accidental provisioning.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jynlo-qa-community-provision-once
  cancel-in-progress: false

jobs:
  provision:
    if: >-
      github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'qa(communities): provision disposable private community once'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      JYNLO_QA_PASSWORD_1: ${{ secrets.JYNLO_QA1_PASSWORD }}
      JYNLO_QA_PASSWORD_2: ${{ secrets.JYNLO_QA2_PASSWORD }}
      JYNLO_QA_USERNAME_1: ${{ secrets.JYNLO_QA1_USERNAME }}
      JYNLO_QA_USERNAME_2: ${{ secrets.JYNLO_QA2_USERNAME }}
      JYNLO_QA_PROVISION_CONSENT: QA_PRIVATE_COMMUNITY_CREATE_ONCE
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate QA script syntax
        run: node --check scripts/qa/jynlo-provision-private-community.cjs
      - name: Create or reuse QA private community and add second QA account
        run: node scripts/qa/jynlo-provision-private-community.cjs
