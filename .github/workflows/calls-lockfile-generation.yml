name: Temporary calls dependency lockfile
on:
  pull_request:
    types: [synchronize]
    branches: [preview/render-fullstack]
    paths: ['package.json', '.github/workflows/calls-lockfile-generation.yml']
permissions:
  contents: write
jobs:
  generate:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/private-voice-video-calls-20261026' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package-lock.json
            git commit -m "build(calls): lock public LiveKit type dependencies"
            git push origin HEAD:${{ github.head_ref }}
          fi
