services:
  desporto24fe:
    container_name: desporto24fecontainer
    build:
      context: .
      dockerfile: Dockerfile
    image: desporto24fe:v2
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      BACKEND_UPSTREAM: http://desporto24be:8080
    depends_on:
      - desporto24be
    networks:
      - internalnet

  desporto24be:
    image: desporto24be:v2
    container_name: desporto24becontainer
    restart: unless-stopped
    expose:
      - "8080"
    networks:
      - internalnet

networks:
  internalnet:
    driver: bridge
