<section class="contact-page">
  <div class="contact-shell">
    <header class="page-header">
      <div>
        <h1>{{ 'contact.title' | t }}</h1>
        <p class="subtitle">{{ 'contact.subtitle' | t }}</p>
      </div>

      <div class="header-actions">
        <a class="secondary-action jynlo-action jynlo-action--neutral" routerLink="/home">{{ 'nav.home' | t }}</a>
        <a class="secondary-action jynlo-action jynlo-action--neutral" routerLink="/login">{{ 'nav.login' | t }}</a>
      </div>
    </header>

    <div class="contact-note">
      <strong>{{ 'contact.noteTitle' | t }}</strong>
      <p>
        {{ 'contact.noteText' | t }}
        <a href="mailto:desporto24app@gmail.com">desporto24app@gmail.com</a>.
      </p>
    </div>

    @if (errorMessage) {
      <div class="feedback error-feedback">{{ errorMessage }}</div>
    }

    @if (successMessage) {
      <div class="feedback success-feedback">{{ successMessage }}</div>
    }

    <form class="contact-card" method="post" (ngSubmit)="submit()" novalidate>
      <div class="form-grid">
        <label>
          <span>{{ 'contact.name' | t }} *</span>
          <input
            name="name"
            [(ngModel)]="name"
            autocomplete="name"
            [disabled]="loading"
            [attr.aria-invalid]="fieldErrors.name ? 'true' : 'false'"
            (input)="clearFieldError('name')">
          @if (fieldErrors.name) {
            <small class="field-error">{{ fieldErrors.name }}</small>
          }
        </label>

        <label>
          <span>{{ 'common.email' | t }} *</span>
          <input
            type="email"
            name="email"
            [(ngModel)]="email"
            autocomplete="email"
            [disabled]="loading"
            [attr.aria-invalid]="fieldErrors.email ? 'true' : 'false'"
            (input)="clearFieldError('email')">
          @if (fieldErrors.email) {
            <small class="field-error">{{ fieldErrors.email }}</small>
          }
        </label>

        <label class="full-width">
          <span>{{ 'contact.category' | t }} *</span>
          <select
            name="category"
            [(ngModel)]="category"
            [disabled]="loading"
            [attr.aria-invalid]="fieldErrors.category ? 'true' : 'false'"
            (change)="clearFieldError('category')">
            <option value="">{{ 'contact.categoryPlaceholder' | t }}</option>
            @for (categoryKey of categories; track categoryKey) {
              <option [value]="categoryKey">{{ categoryKey | t }}</option>
            }
          </select>
          @if (fieldErrors.category) {
            <small class="field-error">{{ fieldErrors.category }}</small>
          }
        </label>

        <label class="full-width">
          <span>{{ 'contact.message' | t }} *</span>
          <textarea
            name="problem"
            [(ngModel)]="problem"
            maxlength="4000"
            rows="8"
            [disabled]="loading"
            [attr.aria-invalid]="fieldErrors.problem ? 'true' : 'false'"
            (input)="clearFieldError('problem')"
            [placeholder]="'contact.messagePlaceholder' | t"></textarea>
          <div class="field-footer">
            @if (fieldErrors.problem) {
              <small class="field-error">{{ fieldErrors.problem }}</small>
            } @else {
              <span></span>
            }
            <small>{{ problem.length }}/4000</small>
          </div>
        </label>
      </div>

      <div class="form-actions">
        <button class="jynlo-action jynlo-action--primary" type="submit" [disabled]="loading">
          {{ loading ? ('contact.sending' | t) : ('contact.send' | t) }}
        </button>
      </div>
    </form>
  </div>
</section>
