<section class="contact-page">
  <div class="contact-shell">
    <header class="page-header">
      <div>
        <p class="eyebrow">Desporto24</p>
        <h1>Fala connosco</h1>
        <p class="subtitle">Tens uma ideia, uma sugestão ou algo que devíamos melhorar? Envia-nos.</p>
      </div>

      <div class="header-actions">
        <a class="secondary-action" routerLink="/home">Início</a>
        <a class="secondary-action" routerLink="/login">Entrar</a>
      </div>
    </header>

    @if (errorMessage) {
      <div class="feedback error-feedback">{{ errorMessage }}</div>
    }

    @if (successMessage) {
      <div class="feedback success-feedback">{{ successMessage }}</div>
    }

    <form class="contact-card" (ngSubmit)="submit()">
      <div class="form-grid">
        <label>
          <span>Nome *</span>
          <input
            name="name"
            [(ngModel)]="name"
            autocomplete="name"
            [disabled]="loading">
        </label>

        <label>
          <span>Localidade *</span>
          <input
            name="city"
            [(ngModel)]="city"
            autocomplete="address-level2"
            [disabled]="loading">
        </label>

        <label>
          <span>Email *</span>
          <input
            type="email"
            name="email"
            [(ngModel)]="email"
            autocomplete="email"
            [disabled]="loading">
        </label>

        <label>
          <span>Género *</span>
          <select name="gender" [(ngModel)]="gender" [disabled]="loading">
            <option value="">Selecionar</option>
            <option value="masculino">Masculino</option>
            <option value="feminino">Feminino</option>
            <option value="outro">Outro</option>
            <option value="prefiro-nao-dizer">Prefiro não dizer</option>
          </select>
        </label>

        <label class="full-width">
          <span>Assunto *</span>
          <input
            name="subject"
            [(ngModel)]="subject"
            maxlength="160"
            [disabled]="loading"
            placeholder="Ex.: Sugestão para torneios">
        </label>

        <label class="full-width">
          <span>Mensagem *</span>
          <textarea
            name="problem"
            [(ngModel)]="problem"
            maxlength="4000"
            rows="8"
            [disabled]="loading"
            placeholder="Conta-nos a tua ideia..."></textarea>
          <small>{{ problem.length }}/4000</small>
        </label>
      </div>

      <div class="form-actions">
        <button type="submit" [disabled]="loading">
          {{ loading ? 'A enviar...' : 'Enviar mensagem' }}
        </button>
      </div>
    </form>
  </div>
</section>
