<section class="about-page">
  <div class="about-shell">
    <header class="page-header">
      <h1>{{ 'about.title' | t }}</h1>
      <p class="subtitle">{{ 'about.subtitle' | t }}</p>
    </header>

    <div class="about-grid">
      <article class="about-card">
        <span class="card-number">01</span>
        <h2>{{ 'about.who.title' | t }}</h2>
        <p>{{ 'about.who.text' | t }}</p>
      </article>

      <article class="about-card">
        <span class="card-number">02</span>
        <h2>{{ 'about.goal.title' | t }}</h2>
        <p>{{ 'about.goal.text' | t }}</p>
      </article>

      <article class="about-card">
        <span class="card-number">03</span>
        <h2>{{ 'about.more.title' | t }}</h2>
        <p>{{ 'about.more.text' | t }}</p>
      </article>
    </div>

    <div class="about-actions">
      <a class="primary-action jynlo-action jynlo-action--primary" routerLink="/login/registerNewUser">{{ 'about.join' | t }}</a>
      <a class="secondary-action jynlo-action jynlo-action--neutral" routerLink="/contact">{{ 'about.contact' | t }}</a>
    </div>
  </div>
</section>
