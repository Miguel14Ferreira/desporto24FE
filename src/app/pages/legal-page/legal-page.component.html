<section class="legal-page">
  <div class="legal-shell">
    <header class="legal-header">
      <p class="eyebrow">{{ 'legal.eyebrow' | t }}</p>
      <h1>{{ titleKey | t }}</h1>
      <p class="intro">{{ introKey | t }}</p>
      <p class="updated">{{ 'legal.updated' | t }}</p>
    </header>

    <aside class="pilot-notice" role="note">
      {{ 'legal.pilotNotice' | t }}
    </aside>

    <nav class="delete-account-actions" *ngIf="document === 'delete'" aria-label="Opções de eliminação de conta">
      <a routerLink="/menu/dadosPerfil">{{ 'delete.openProfile' | t }}</a>
      <a href="mailto:desporto24app@gmail.com?subject=Jynlo%20-%20Pedido%20de%20elimina%C3%A7%C3%A3o%20de%20conta">{{ 'delete.emailSupport' | t }}</a>
    </nav>

    <div class="legal-sections">
      <article class="legal-card" *ngFor="let section of sections">
        <h2>{{ section.titleKey | t }}</h2>
        <p>{{ section.textKey | t }}</p>
      </article>
    </div>

    <footer class="legal-footer">
      <p>{{ 'legal.contact' | t }}</p>
      <a routerLink="/home">{{ 'legal.back' | t }}</a>
    </footer>
  </div>
</section>
