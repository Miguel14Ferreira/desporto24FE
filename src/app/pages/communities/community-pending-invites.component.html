<section class="invites-card">
        <h2>{{ 'communities.pendingInvites' | t }}</h2>
        @for (invite of invites; track invite.id) {
          <div class="invite-row" [class.invite-row--targeted]="invite.id === targetedInviteId">
            <div>
              <strong>{{ invite.communityName }}</strong>
              <span>{{ 'communities.invitedBy' | t:{ username: invite.invitedByUsername } }}</span>
            </div>
            <div class="row-actions">
              <button type="button" class="primary-action small jynlo-action jynlo-action--primary jynlo-action--compact" (click)="acceptRequested.emit(invite)">
                {{ 'communities.accept' | t }}
              </button>
              <button type="button" class="secondary-action small jynlo-action jynlo-action--neutral jynlo-action--compact" (click)="rejectRequested.emit(invite)">
                {{ 'communities.reject' | t }}
              </button>
            </div>
          </div>
        }
      </section>
