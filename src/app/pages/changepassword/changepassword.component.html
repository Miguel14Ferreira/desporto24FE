<section class="password-page">
  <div class="password-shell">
    <header class="page-header">
      <div>
        <h1>{{ 'password.title' | t }}</h1>
        <p class="subtitle">{{ 'password.subtitle' | t }}</p>
      </div>

      <div class="header-actions">
        <a class="secondary-action jynlo-action jynlo-action--neutral" routerLink="/menu/dadosPerfil">{{ 'menu.profile' | t }}</a>
      </div>
    </header>

    @if (errorMessage) {
      <div class="feedback error-feedback">{{ errorMessage }}</div>
    }

    @if (successMessage) {
      <div class="feedback success-feedback">{{ successMessage }}</div>
    }

    <form class="password-card" (ngSubmit)="changePassword()">
      <label>
        <span>{{ 'password.current' | t }}</span>
        <div class="password-field">
          <input
            [type]="showCurrent ? 'text' : 'password'"
            name="currentPassword"
            [(ngModel)]="currentPassword"
            autocomplete="current-password"
            [disabled]="saving">
          <button class="jynlo-action jynlo-action--neutral" type="button" (click)="showCurrent = !showCurrent">
            {{ showCurrent ? ('common.hide' | t) : ('common.show' | t) }}
          </button>
        </div>
      </label>

      <label>
        <span>{{ 'password.new' | t }}</span>
        <div class="password-field">
          <input
            [type]="showNew ? 'text' : 'password'"
            name="newPassword"
            [(ngModel)]="newPassword"
            autocomplete="new-password"
            minlength="8"
            maxlength="128"
            [disabled]="saving">
          <button class="jynlo-action jynlo-action--neutral" type="button" (click)="showNew = !showNew">
            {{ showNew ? ('common.hide' | t) : ('common.show' | t) }}
          </button>
        </div>
        <small>{{ 'password.minimum' | t }}</small>
      </label>

      <label>
        <span>{{ 'password.confirm' | t }}</span>
        <input
          [type]="showNew ? 'text' : 'password'"
          name="confirmPassword"
          [(ngModel)]="confirmPassword"
          autocomplete="new-password"
          minlength="8"
          maxlength="128"
          [disabled]="saving">
      </label>

      <div class="form-actions">
        <a class="secondary-action jynlo-action jynlo-action--neutral" routerLink="/menu">{{ 'common.cancel' | t }}</a>
        <button class="jynlo-action jynlo-action--primary" type="submit" [disabled]="saving">
          {{ saving ? ('password.saving' | t) : ('password.save' | t) }}
        </button>
      </div>
    </form>
  </div>
</section>
