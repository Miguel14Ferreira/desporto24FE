<section class="password-page">
  <div class="password-shell">
    <header class="page-header">
      <div>
        <p class="eyebrow">Desporto24</p>
        <h1>Alterar palavra-passe</h1>
        <p class="subtitle">Confirma a palavra-passe atual e define uma nova.</p>
      </div>

      <div class="header-actions">
        <a class="secondary-action" routerLink="/menu/dadosPerfil">Perfil</a>
        <a class="secondary-action" routerLink="/menu">Menu</a>
      </div>
    </header>

    @if (errorMessage) {
      <div class="feedback error-feedback">{{ errorMessage }}</div>
    }

    @if (successMessage) {
      <div class="feedback success-feedback">{{ successMessage }}</div>
    }

    <form class="password-card" (ngSubmit)="changePassword()">
      <label>
        <span>Palavra-passe atual</span>
        <div class="password-field">
          <input
            [type]="showCurrent ? 'text' : 'password'"
            name="currentPassword"
            [(ngModel)]="currentPassword"
            autocomplete="current-password"
            [disabled]="saving">
          <button type="button" (click)="showCurrent = !showCurrent">
            {{ showCurrent ? 'Ocultar' : 'Mostrar' }}
          </button>
        </div>
      </label>

      <label>
        <span>Nova palavra-passe</span>
        <div class="password-field">
          <input
            [type]="showNew ? 'text' : 'password'"
            name="newPassword"
            [(ngModel)]="newPassword"
            autocomplete="new-password"
            minlength="8"
            maxlength="128"
            [disabled]="saving">
          <button type="button" (click)="showNew = !showNew">
            {{ showNew ? 'Ocultar' : 'Mostrar' }}
          </button>
        </div>
        <small>Mínimo de 8 caracteres.</small>
      </label>

      <label>
        <span>Confirmar nova palavra-passe</span>
        <input
          [type]="showNew ? 'text' : 'password'"
          name="confirmPassword"
          [(ngModel)]="confirmPassword"
          autocomplete="new-password"
          minlength="8"
          maxlength="128"
          [disabled]="saving">
      </label>

      <div class="form-actions">
        <a class="secondary-action" routerLink="/menu">Cancelar</a>
        <button type="submit" [disabled]="saving">
          {{ saving ? 'A alterar...' : 'Alterar palavra-passe' }}
        </button>
      </div>
    </form>
  </div>
</section>
