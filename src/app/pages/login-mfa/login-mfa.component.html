<section class="mfa-page">
  <div class="mfa-card">
    <p class="eyebrow">Verificação adicional</p>
    <h1>Confirma o código MFA</h1>
    <p class="subtitle">
      Enviámos um código por SMS.
      @if (expiryLabel()) {
        Este desafio é válido até às {{ expiryLabel() }}.
      }
    </p>

    @if (errorMessage) {
      <div class="feedback error-feedback">{{ errorMessage }}</div>
    }

    @if (successMessage) {
      <div class="feedback success-feedback">{{ successMessage }}</div>
    }

    <form (ngSubmit)="confirmCode()">
      <label>
        <span>Código</span>
        <input
          name="code"
          [(ngModel)]="code"
          autocomplete="one-time-code"
          [disabled]="confirming"
          placeholder="Código recebido por SMS">
      </label>

      <button
        type="submit"
        class="primary-action"
        [disabled]="confirming || !challengeId">
        {{ confirming ? 'A confirmar...' : 'Confirmar e entrar' }}
      </button>
    </form>

    <div class="secondary-actions">
      <button
        type="button"
        [disabled]="resending || !challengeId"
        (click)="resendCode()">
        {{ resending ? 'A reenviar...' : 'Reenviar código' }}
      </button>
      <button type="button" (click)="cancel()">Voltar ao login</button>
    </div>
  </div>
</section>
