<section class="venue-create-page">
  <div class="venue-create-shell">
    <a class="back-link" routerLink="/menu/discover">{{ 'venue.detail.back' | t }}</a>
    <span class="venue-kicker">{{ 'venue.kicker' | t }}</span>
    <h1>{{ 'venue.saveNew' | t }}</h1>

    <form class="venue-create-form">
      <label>
        <span>{{ 'venue.name' | t }}</span>
        <input
          type="text"
          name="name"
          [(ngModel)]="name"
          [placeholder]="'venue.namePlaceholder' | t">
      </label>

      <label>
        <span>{{ 'venue.detail.city' | t }}</span>
        <input
          type="text"
          name="city"
          [(ngModel)]="city"
          autocomplete="address-level2"
          [placeholder]="'events.cityPlaceholder' | t">
      </label>

      <label class="venue-create-wide">
        <span>{{ 'common.address' | t }}</span>
        <input
          type="text"
          name="address"
          [(ngModel)]="address"
          autocomplete="street-address"
          [placeholder]="'createSession.addressPlaceholder' | t">
      </label>

      <label>
        <span>{{ 'events.sport' | t }}</span>
        <input type="text" name="sports" list="venue-create-sports" [(ngModel)]="sports"
          autocomplete="off" [placeholder]="'events.sportPlaceholder' | t">
        <datalist id="venue-create-sports">
          @for (sportOption of sportsCatalog; track sportOption) {
            <option [value]="sportOption"></option>
          }
        </datalist>
      </label>

      <label>
        <span>{{ 'venue.type' | t }}</span>
        <input type="text" name="venueType" [(ngModel)]="venueType"
          [placeholder]="'venue.typePlaceholder' | t">
      </label>

      <label>
        <span>{{ 'venue.ownership' | t }}</span>
        <select name="ownershipType" [(ngModel)]="ownershipType">
          <option [ngValue]="null">{{ 'venue.ownership.none' | t }}</option>
          <option value="PUBLIC">{{ 'venue.ownership.public' | t }}</option>
          <option value="PRIVATE">{{ 'venue.ownership.private' | t }}</option>
        </select>
      </label>

      <label>
        <span>{{ 'venue.surface' | t }}</span>
        <input type="text" name="surfaceType" [(ngModel)]="surfaceType"
          [placeholder]="'venue.surfacePlaceholder' | t">
      </label>

      <div class="venue-create-options venue-create-wide">
        <label class="venue-create-option">
          <input type="checkbox" name="indoor" [(ngModel)]="indoor">
          <span>{{ 'venue.indoor' | t }}</span>
        </label>
        <label class="venue-create-option">
          <input type="checkbox" name="changingRooms" [(ngModel)]="changingRooms">
          <span>{{ 'venue.changingRooms' | t }}</span>
        </label>
        <label class="venue-create-option">
          <input type="checkbox" name="parking" [(ngModel)]="parking">
          <span>{{ 'venue.parking' | t }}</span>
        </label>
        <label class="venue-create-option">
          <input type="checkbox" name="lighting" [(ngModel)]="lighting">
          <span>{{ 'venue.lighting' | t }}</span>
        </label>
      </div>
    </form>
  </div>
</section>
