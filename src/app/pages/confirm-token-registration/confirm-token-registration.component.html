<section class="confirmation-page">
  <div class="confirmation-card">
    <p class="eyebrow">Ativação de conta</p>

    @if (loading) {
      <h1>A confirmar a tua conta...</h1>
      <p class="subtitle">Só demora alguns segundos.</p>
    }

    @if (!loading && successMessage) {
      <h1>Conta ativada</h1>
      <div class="feedback success-feedback">{{ successMessage }}</div>
      <a class="primary-action" routerLink="/login">Entrar no Desporto24</a>
    }

    @if (!loading && errorMessage) {
      <h1>Não foi possível ativar a conta</h1>
      <div class="feedback error-feedback">{{ errorMessage }}</div>
      <a class="secondary-action" routerLink="/login">Voltar ao login</a>
    }
  </div>
</section>
