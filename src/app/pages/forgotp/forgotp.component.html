<section class="reset-page">
  <div class="reset-card">
    <p class="eyebrow">{{ 'reset.eyebrow' | t }}</p>
    <h1>{{ 'reset.title' | t }}</h1>
    <p class="subtitle">{{ 'reset.subtitle' | t }}</p>

    @if (errorMessage) {
      <div class="feedback error-feedback">{{ errorMessage }}</div>
    }

    @if (successMessage) {
      <div class="feedback success-feedback">{{ successMessage }}</div>
    }

    <form method="post" (ngSubmit)="sendResetEmail()">
      <label>
        <span>{{ 'common.email' | t }}</span>
        <input
          type="email"
          name="email"
          [(ngModel)]="email"
          autocomplete="email"
          [disabled]="loading"
          placeholder="teu@email.pt">
      </label>

      <button type="submit" class="primary-action jynlo-action jynlo-action--primary" [disabled]="loading">
        {{ loading ? ('contact.sending' | t) : ('reset.sendLink' | t) }}
      </button>
    </form>

    <a class="back-link" routerLink="/login">← {{ 'reset.back' | t }}</a>
  </div>
</section>
