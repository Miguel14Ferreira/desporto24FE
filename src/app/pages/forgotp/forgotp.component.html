<section class="reset-page">
  <div class="reset-card">
    <p class="eyebrow">Recuperar acesso</p>
    <h1>Esqueceste-te da palavra-passe?</h1>
    <p class="subtitle">Indica o email da tua conta. Vais receber um link seguro para definires uma nova palavra-passe.</p>

    @if (errorMessage) {
      <div class="feedback error-feedback">{{ errorMessage }}</div>
    }

    @if (successMessage) {
      <div class="feedback success-feedback">{{ successMessage }}</div>
    }

    <form (ngSubmit)="sendResetEmail()">
      <label>
        <span>Email</span>
        <input
          type="email"
          name="email"
          [(ngModel)]="email"
          autocomplete="email"
          [disabled]="loading"
          placeholder="teu@email.pt">
      </label>

      <button type="submit" class="primary-action" [disabled]="loading">
        {{ loading ? 'A enviar...' : 'Enviar link de recuperação' }}
      </button>
    </form>

    <a class="back-link" routerLink="/login">← Voltar ao login</a>
  </div>
</section>
