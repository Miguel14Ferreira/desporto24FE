<section class="reset-page">
  <div class="reset-card">
    <p class="eyebrow">Nova palavra-passe</p>
    <h1>Define uma nova palavra-passe</h1>
    <p class="subtitle">Escolhe uma palavra-passe com pelo menos 8 caracteres.</p>

    @if (errorMessage) {
      <div class="feedback error-feedback">{{ errorMessage }}</div>
    }

    @if (successMessage) {
      <div class="feedback success-feedback">{{ successMessage }}</div>
    }

    <form (ngSubmit)="resetPassword()">
      <label>
        <span>Nova palavra-passe</span>
        <div class="password-field">
          <input
            [type]="showPassword ? 'text' : 'password'"
            name="newPassword"
            [(ngModel)]="newPassword"
            autocomplete="new-password"
            minlength="8"
            maxlength="128"
            [disabled]="loading || !token">
          <button type="button" (click)="showPassword = !showPassword">
            {{ showPassword ? 'Ocultar' : 'Mostrar' }}
          </button>
        </div>
      </label>

      <label>
        <span>Confirmar palavra-passe</span>
        <input
          [type]="showPassword ? 'text' : 'password'"
          name="confirmPassword"
          [(ngModel)]="confirmPassword"
          autocomplete="new-password"
          minlength="8"
          maxlength="128"
          [disabled]="loading || !token">
      </label>

      <button type="submit" class="primary-action" [disabled]="loading || !token">
        {{ loading ? 'A guardar...' : 'Guardar nova palavra-passe' }}
      </button>
    </form>

    <button type="button" class="back-action" (click)="goToLogin()">Voltar ao login</button>
  </div>
</section>
