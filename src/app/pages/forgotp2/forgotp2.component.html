<section class="reset-page">
  <div class="reset-card">
    <p class="eyebrow">{{ 'reset.newEyebrow' | t }}</p>
    <h1>{{ 'reset.newTitle' | t }}</h1>
    <p class="subtitle">{{ 'reset.newSubtitle' | t }}</p>

    @if (errorMessage) {
      <div class="feedback error-feedback">{{ errorMessage }}</div>
    }

    @if (successMessage) {
      <div class="feedback success-feedback">{{ successMessage }}</div>
    }

    <form method="post" (ngSubmit)="resetPassword()">
      <label>
        <span>{{ 'password.new' | t }}</span>
        <div class="password-field">
          <input
            [type]="showPassword ? 'text' : 'password'"
            name="newPassword"
            [(ngModel)]="newPassword"
            autocomplete="new-password"
            minlength="8"
            maxlength="128"
            [disabled]="loading || !token">
          <button class="jynlo-action jynlo-action--neutral" type="button" (click)="showPassword = !showPassword">
            {{ showPassword ? ('common.hide' | t) : ('common.show' | t) }}
          </button>
        </div>
      </label>

      <label>
        <span>{{ 'reset.confirmPassword' | t }}</span>
        <input
          [type]="showPassword ? 'text' : 'password'"
          name="confirmPassword"
          [(ngModel)]="confirmPassword"
          autocomplete="new-password"
          minlength="8"
          maxlength="128"
          [disabled]="loading || !token">
      </label>

      <button type="submit" class="primary-action jynlo-action jynlo-action--primary" [disabled]="loading || !token">
        {{ loading ? ('profile.saving' | t) : ('reset.save' | t) }}
      </button>
    </form>

    <button type="button" class="back-action jynlo-action jynlo-action--neutral" (click)="goToLogin()">{{ 'reset.back' | t }}</button>
  </div>
</section>
