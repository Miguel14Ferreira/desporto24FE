<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <!-- Works on Render Static Sites even before their HTTP headers are set.
       Meta CSP cannot enforce frame-ancestors/HSTS; Render headers remain required. -->
  <meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Jynlo — Join the game.</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Jynlo — encontra onde, quando e com quem jogar.">
  <meta name="robots" content="index,follow">
  <link rel="icon" type="image/webp" href="/assets/jynlo-icon-approved.webp">
  <link rel="alternate icon" type="image/x-icon" href="/favicon.ico">
  <link rel="preload" href="/assets/jynlo-splash-approved.webp" as="image" type="image/webp" fetchpriority="high">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
  <!-- Inline critical CSS: the splash renders before Angular and external styles load. -->
  <style>
    #jynlo-startup-splash {
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      display: grid;
      place-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      background:
        radial-gradient(ellipse 26rem 24rem at 50% 49%, rgba(0, 185, 174, .20), transparent 76%),
        radial-gradient(ellipse 55rem 45rem at 50% 58%, rgba(4, 79, 94, .20), transparent 80%),
        linear-gradient(155deg, #001422, #052234 55%, #041321);
      opacity: 1;
      visibility: visible;
      transition: opacity 240ms ease, visibility 240ms ease;
      /* Never trap the visitor if script loading or initial routing fails. */
      animation: jynlo-startup-failsafe 0s 20s forwards;
    }
    #jynlo-startup-splash.jynlo-startup-splash--exit {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    /* The artwork is the approved rendered image, not an SVG recreation. */
    #jynlo-startup-splash .jynlo-startup-art {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center center;
      user-select: none;
      pointer-events: none;
    }
    @keyframes jynlo-startup-failsafe {
      to { opacity: 0; visibility: hidden; pointer-events: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      #jynlo-startup-splash { transition: none; }
    }
  </style>
</head>
<body>
  <div id="jynlo-startup-splash" role="status" aria-label="A carregar a Jynlo">
    <img class="jynlo-startup-art"
         src="/assets/jynlo-splash-approved.webp"
         alt="Jynlo"
         width="480" height="853"
         decoding="async" fetchpriority="high">
  </div>
  <app-root></app-root>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.0/font/bootstrap-icons.css">
</body>
</html>
